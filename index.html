<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- App interna: NO indexar (perfiles = contenido de usuario). -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/images/imagoWBG.png" />
    <title>Perfil — Dotrino</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        font-family: var(--dt-font);
        background: var(--dt-bg); color: var(--dt-text);
        display: flex; align-items: center; justify-content: center;
      }
      #app { width: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .state { text-align: center; color: var(--dt-text-dim); max-width: 28rem; padding: 2rem; }
      .state h1 { font-size: 1.2rem; color: var(--dt-text); margin: 0 0 .5rem; }
      .state a { color: var(--dt-accent); }
      /* Vista de validación (#v=): banner de firma + contenido + perfil/reputación. */
      .validate-wrap { max-width: 30rem; width: 100%; display: flex; flex-direction: column; gap: 1rem; padding: 1.2rem; }
      .banner { border-radius: 16px; padding: 1rem 1.2rem; font-weight: 600; font-size: 1.05rem; }
      .banner.ok { background: var(--dt-mint-soft); color: var(--dt-ok); border: 1px solid var(--dt-mint); }
      .banner.bad { background: var(--dt-error-soft); color: var(--dt-error); border: 1px solid var(--dt-error); }
      .content { background: var(--dt-surface); border: 1px solid var(--dt-line-soft); border-radius: 16px; padding: 1rem 1.2rem; white-space: pre-wrap; color: var(--dt-text); box-shadow: var(--dt-shadow); }
    </style>
  <!-- PWA (CONVENCIONES §3): manifiesto, tema e iconos de pantalla de inicio. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#00658c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Perfil" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="app">
      <div class="state"><p>Cargando perfil…</p></div>
    </div>
    <!-- Moneda de support del ecosistema (CONVENCIONES §6, Web Component @0.6). -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@dotrino/support@0.9/src/index.js"></script>
    <script type="module" src="/src/main.js"></script>
  <script>
    // Registro del service worker (§3): la app queda disponible sin conexión.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {})
      })
    }
  </script>
  </body>
</html>
